# Calls the scheduled jobs from GitHub's scheduler. Vercel's free plan only
# allows daily cron jobs; source archiving should retry every few minutes.
#
# Off until you opt in: set the repository variable ENABLE_SCHEDULED_JOBS=true
# and the secrets SITE_URL (e.g. https://example.org) and CRON_SECRET.
# Cost: free on public repositories. On private ones every run bills at least
# one runner-minute, so a 5-minute schedule uses ~8,600 minutes a month, more
# than the free allowance; use a slower schedule or Vercel Pro cron instead.
name: Scheduled jobs

on:
  schedule:
    - cron: '*/5 * * * *'   # archive new sources
    - cron: '20 5 * * *'    # nightly export + retention
    - cron: '45 10 * * *'   # morning news scan: read what Vercel's 10:10 pass left
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        type: choice
        options: [archive, export, retention, nightly, news-scan]
        default: archive

permissions: {}

jobs:
  run:
    if: vars.ENABLE_SCHEDULED_JOBS == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Choose the job
        id: pick
        # Event values reach the script as environment variables, never as code.
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            job="$INPUT_JOB"
          elif [ "$SCHEDULE" = "*/5 * * * *" ]; then
            job=archive
          elif [ "$SCHEDULE" = "45 10 * * *" ]; then
            job=news-scan-rest
          else
            job=nightly
          fi
          case "$job" in
            archive|export|retention|nightly|news-scan|news-scan-rest) echo "job=$job" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown job: $job"; exit 1 ;;
          esac
      - name: Call the job endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          echo "Running $JOB"
          if [ "$JOB" = "news-scan" ] || [ "$JOB" = "news-scan-rest" ]; then
            # One pass reads for up to five minutes; repeat (reading only) while articles wait.
            query=""
            [ "$JOB" = "news-scan-rest" ] && query="?collect=0"
            for pass in 1 2 3 4 5 6; do
              out=$(curl --fail-with-body --silent --show-error --max-time 320 \
                -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/jobs/news-scan$query")
              echo "$out"
              remaining=$(echo "$out" | jq -r '.remaining // 0')
              stopped=$(echo "$out" | jq -r '.stoppedAt // "done"')
              if [ "$remaining" = "0" ] || [ "$stopped" = "daily_limit" ]; then break; fi
              query="?collect=0"
            done
          else
            curl --fail-with-body --silent --show-error --max-time 90 \
              -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/jobs/$JOB"
          fi
          echo
